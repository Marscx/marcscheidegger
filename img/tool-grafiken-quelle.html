<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernen Grafiken</title>
<style>
  :root {
    --navy: #0b1220;
    --navy-2: #16213a;
    --line: #2a3a5e;
    --blue: #c5d3ec;
    --blue-2: #8fa8dc;
    --accent: #f2b544;
    --red: #e05a4f;
    --green: #4fbf7a;
    --white: #f5f7fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; background: var(--navy); }
  body { font-family: "Poppins", "Avenir Next", "Helvetica Neue", Arial, sans-serif; color: var(--white); }
  .card {
    position: relative; width: 1200px; height: 1200px; display: none;
    background:
      radial-gradient(circle at 20% 15%, rgba(143,168,220,.22), transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(242,181,68,.12), transparent 50%),
      var(--navy);
    padding: 110px;
  }
  .card.active { display: flex; flex-direction: column; justify-content: space-between; }
  .kicker { font-size: 34px; letter-spacing: .32em; text-transform: uppercase; color: var(--blue-2); font-weight: 600; }
  .title { font-size: 104px; font-weight: 700; line-height: 1.02; margin-top: 18px; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; }
  .foot { font-size: 34px; color: var(--blue); opacity: .8; }

  /* Würfel */
  .dice-wrap { display: flex; gap: 70px; align-items: center; }
  .die {
    width: 330px; height: 330px; border-radius: 64px; background: var(--white);
    box-shadow: 0 40px 80px rgba(0,0,0,.45), inset 0 -18px 0 rgba(11,18,32,.12);
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 52px; transform: rotate(-9deg);
  }
  .pip { width: 58px; height: 58px; border-radius: 50%; background: var(--navy); place-self: center; }
  .chord {
    width: 400px; padding: 44px 40px; border-radius: 40px; background: var(--navy-2); border: 3px solid var(--line);
    transform: rotate(5deg); box-shadow: 0 40px 80px rgba(0,0,0,.4);
  }
  .chord .name { font-size: 92px; font-weight: 700; color: var(--accent); }
  .chord .form { font-size: 36px; color: var(--blue); margin-bottom: 26px; }

  /* Übe-Timer */
  .timer { position: relative; width: 600px; height: 600px; }
  .timer .time { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .timer .time b { font-size: 150px; font-weight: 700; letter-spacing: .02em; }
  .timer .time span { font-size: 38px; color: var(--blue); margin-top: 6px; }
  .legend { display: flex; gap: 40px; justify-content: center; margin-top: 40px; font-size: 34px; color: var(--blue); }
  .legend i { display: inline-block; width: 26px; height: 26px; border-radius: 50%; margin-right: 12px; vertical-align: -3px; }
</style>
</head>
<body>

<!-- Würfel -->
<section class="card" id="wuerfel">
  <div>
    <div class="kicker">Übe-Tool</div>
    <div class="title">Würfel</div>
  </div>
  <div class="stage">
    <div class="dice-wrap">
      <div class="die">
        <i class="pip" style="grid-area:1/1"></i><i class="pip" style="grid-area:1/3"></i>
        <i class="pip" style="grid-area:2/2"></i>
        <i class="pip" style="grid-area:3/1"></i><i class="pip" style="grid-area:3/3"></i>
      </div>
      <div class="chord">
        <div class="name">Em</div>
        <div class="form">Dm-Form</div>
        <!-- Em in Dm-Form (Bund 2–5), oben = hohe e-Saite -->
        <svg viewBox="0 0 320 290" width="320" height="290">
          <g stroke="#8fa8dc" stroke-width="4">
            <line x1="20" y1="20" x2="300" y2="20"/><line x1="20" y1="64" x2="300" y2="64"/>
            <line x1="20" y1="108" x2="300" y2="108"/><line x1="20" y1="152" x2="300" y2="152"/>
            <line x1="20" y1="196" x2="300" y2="196"/><line x1="20" y1="240" x2="300" y2="240"/>
            <line x1="20" y1="20" x2="20" y2="240"/><line x1="90" y1="20" x2="90" y2="240"/>
            <line x1="160" y1="20" x2="160" y2="240"/><line x1="230" y1="20" x2="230" y2="240"/>
            <line x1="300" y1="20" x2="300" y2="240"/>
          </g>
          <g fill="#f2b544">
            <circle cx="125" cy="20" r="20"/><circle cx="265" cy="64" r="20"/>
            <circle cx="195" cy="108" r="20"/>
          </g>
          <circle cx="55" cy="152" r="20" fill="#f5f7fb"/>
          <text x="55" y="282" fill="#8fa8dc" font-size="26" text-anchor="middle" font-family="Avenir Next, Arial">2</text>
        </svg>
      </div>
    </div>
  </div>
  <div class="foot">Stammton · Chromatik · Akkorde · CAGED · Chaos</div>
</section>

<!-- Übe-Timer -->
<section class="card" id="uebetimer">
  <div>
    <div class="kicker">Übe-Tool</div>
    <div class="title">Übe-Timer</div>
  </div>
  <div class="stage">
    <div>
      <div class="timer">
        <svg viewBox="0 0 600 600" width="600" height="600">
          <circle cx="300" cy="300" r="250" fill="none" stroke="#16213a" stroke-width="56"/>
          <!-- drei Übungen als Segmente: 1570 Umfang -->
          <circle cx="300" cy="300" r="250" fill="none" stroke="#f2b544" stroke-width="56" stroke-linecap="round"
                  stroke-dasharray="470 1100" transform="rotate(-90 300 300)"/>
          <circle cx="300" cy="300" r="250" fill="none" stroke="#e05a4f" stroke-width="56" stroke-linecap="round"
                  stroke-dasharray="470 1100" stroke-dashoffset="-523" transform="rotate(-90 300 300)"/>
          <circle cx="300" cy="300" r="250" fill="none" stroke="#4fbf7a" stroke-width="56" stroke-linecap="round"
                  stroke-dasharray="420 1150" stroke-dashoffset="-1046" transform="rotate(-90 300 300)"/>
        </svg>
        <div class="time"><b>03:15</b><span>3 Übungen</span></div>
      </div>
      <div class="legend">
        <span><i style="background:#f2b544"></i>Einspielen</span>
        <span><i style="background:#e05a4f"></i>Tonleitern</span>
        <span><i style="background:#4fbf7a"></i>Stück</span>
      </div>
    </div>
  </div>
  <div class="foot">Timer nacheinander · Signalton · Journal</div>
</section>

<!-- Instrumentengrafiken -->
<section class="card" id="instrumentengrafik">
  <div>
    <div class="kicker">Übe-Tool</div>
    <div class="title">Instrumenten&shy;grafiken</div>
  </div>
  <div class="stage">
    <svg viewBox="0 0 980 470" width="980" height="470">
      <rect x="0" y="0" width="980" height="470" rx="36" fill="#16213a" stroke="#2a3a5e" stroke-width="3"/>
      <g stroke="#c5d3ec" stroke-width="5">
        <line x1="60" y1="60" x2="940" y2="60"/><line x1="60" y1="130" x2="940" y2="130"/>
        <line x1="60" y1="200" x2="940" y2="200"/><line x1="60" y1="270" x2="940" y2="270"/>
        <line x1="60" y1="340" x2="940" y2="340"/><line x1="60" y1="410" x2="940" y2="410"/>
      </g>
      <g stroke="#8fa8dc" stroke-width="6">
        <line x1="60" y1="60" x2="60" y2="410" stroke-width="18" stroke="#f5f7fb"/>
        <line x1="236" y1="60" x2="236" y2="410"/><line x1="412" y1="60" x2="412" y2="410"/>
        <line x1="588" y1="60" x2="588" y2="410"/><line x1="764" y1="60" x2="764" y2="410"/>
        <line x1="940" y1="60" x2="940" y2="410"/>
      </g>
      <!-- C-Dur in C-Form (offene Lage), oben = hohe e-Saite; 1 = Grundton -->
      <g font-family="Poppins, Avenir Next, Arial" font-size="30" font-weight="700" text-anchor="middle">
        <circle cx="30" cy="60" r="22" fill="none" stroke="#c5d3ec" stroke-width="5"/>
        <circle cx="30" cy="200" r="22" fill="none" stroke="#c5d3ec" stroke-width="5"/>
        <text x="30" y="420" fill="#e05a4f" font-size="34">×</text>
        <circle cx="148" cy="130" r="32" fill="#f2b544"/><text x="148" y="141" fill="#0b1220">1</text>
        <circle cx="324" cy="270" r="32" fill="#c5d3ec"/><text x="324" y="281" fill="#0b1220">3</text>
        <circle cx="500" cy="340" r="32" fill="#f2b544"/><text x="500" y="351" fill="#0b1220">1</text>
      </g>
    </svg>
  </div>
  <div class="foot">C-Dur in C-Form · Gitarre · Ukulele · Keyboard</div>
</section>

<script>
  const id = (location.hash || '#wuerfel').slice(1);
  document.getElementById(id).classList.add('active');
</script>
</body>
</html>
